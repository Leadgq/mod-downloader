appId: com.moddownloader.app
productName: Nox Downloader
directories:
  buildResources: build
files:
  - '!resources/bin/**'
  - '!dist/**'
  - '!tests/**'
  - '!scripts/**'
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
asarUnpack:
  - resources/**
extraResources:
  - from: resources/bin
    to: bin
    filter:
      - '**/*'
      - '!**/*.zip'
      - '!**/*.7z'
      - '!**/.gitkeep'
beforePack: ./scripts/check-binaries.cjs
win:
  icon: build/deepblack-download.ico
  executableName: nox-downloader
nsis:
  installerIcon: build/deepblack-download.ico
  uninstallerIcon: build/deepblack-download.ico
  artifactName: nox-downloader-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  allowToChangeInstallationDirectory: true
  oneClick: false
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  provider: generic
  url: https://example.com/auto-updates
